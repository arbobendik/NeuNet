name: deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # pointing the website's submodule at this commit triggers its deploy workflow
      - uses: actions/checkout@v7
        with:
          repository: arbobendik/arbogast.dev
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
      - run: |
          git config user.name "Bendik Arbogast"
          git config user.email "arbobendik@gmail.com"
          git update-index --cacheinfo 160000,"$GITHUB_SHA",projects/NeuNet
          git diff --cached --quiet && exit 0
          git commit -m "chore(neunet): deploy ${GITHUB_SHA::7}"
          git push || { git pull --rebase && git push; }
